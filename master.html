<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master - Maléfica Burger</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101010;overflow:hidden}#app{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="./index.html?printfix=4"></iframe>
<script>
const app=document.getElementById('app');
app.addEventListener('load',()=>{
  const d=app.contentDocument;
  if(!d)return;
  const s=d.createElement('script');
  s.textContent=`(function(){
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function fixedPrintTicket(i){
      try{
        const o=pending[i];
        if(!o){alert('No se encontró el pedido para imprimir.');return;}
        if(o.paymentStatus!=='Pagado'){alert('Primero confirmá el pago.');return;}

        document.getElementById('malefica-ticket-print')?.remove();
        document.getElementById('malefica-ticket-print-style')?.remove();

        const ticket=document.createElement('div');
        ticket.id='malefica-ticket-print';
        ticket.innerHTML='<h2>MALÉFICA BURGER</h2>'+
          '<div>Pedido #'+esc(o.no)+'</div>'+
          '<div>'+esc(o.customer||'')+'</div>'+
          '<div>'+esc(o.type)+' · '+esc(o.source)+'</div>'+
          '<div>'+new Date(o.date).toLocaleString('es-UY',{timeZone:'America/Montevideo'})+'</div><hr>'+
          (o.items||[]).map(x=>'<div class="tr"><span>'+esc(x.qty)+' × '+esc(x.name)+'</span><span>$'+money(x.qty*x.price)+'</span></div>').join('')+
          '<hr><div class="tt"><b>TOTAL $'+money(o.total)+'</b></div>'+
          '<b>'+esc(o.paymentStatus)+' · '+esc(o.paymentMethod)+'</b>'+
          (o.obs?'<p>Obs: '+esc(o.obs)+'</p>':'');
        ticket.style.display='none';
        document.body.appendChild(ticket);

        const st=document.createElement('style');
        st.id='malefica-ticket-print-style';
        st.textContent='@media print{@page{size:80mm auto;margin:2mm}html,body{background:#fff!important;color:#000!important}body>*{display:none!important}#malefica-ticket-print{display:block!important;position:absolute!important;left:0!important;top:0!important;width:72mm!important;margin:0!important;padding:2mm!important;background:#fff!important;color:#000!important;font-family:monospace!important;font-size:12px!important}#malefica-ticket-print h2{display:block!important;text-align:center!important;color:#000!important;margin:0 0 8px!important}#malefica-ticket-print .tr{display:flex!important;justify-content:space-between!important;gap:6px!important;border-bottom:1px dashed #999!important;padding:4px 0!important}#malefica-ticket-print .tt{font-size:16px!important;margin:7px 0!important}}';
        document.head.appendChild(st);
        window.focus();
        window.print();
      }catch(e){
        console.error(e);
        alert('Error al imprimir el ticket: '+e.message);
      }
    }

    window.printTicket=fixedPrintTicket;
    document.addEventListener('click',function(e){
      const b=e.target.closest&&e.target.closest('button');
      if(!b||!/imprimir/i.test(b.textContent||''))return;
      const box=b.closest('.darkbox');
      if(!box)return;
      const boxes=[...document.querySelectorAll('#pending .darkbox')];
      const i=boxes.indexOf(box);
      if(i<0)return;
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      fixedPrintTicket(i);
    },true);
  })();`;
  d.body.appendChild(s);
});
</script>
</body>
</html>
