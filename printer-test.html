<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Prueba TP95W - Maléfica Burger</title>
<style>
:root{--orange:#ff7a00;--bg:#101010;--card:#222;--white:#fff;--green:#228b45;--red:#c33}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--white)}
main{max-width:560px;margin:0 auto;padding:24px 16px}.card{background:var(--card);border:1px solid #444;border-radius:18px;padding:20px}h1{margin-top:0;color:var(--orange);font-size:26px}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px}.primary{background:var(--orange);color:#fff}.secondary{background:#ddd;color:#111}.status{margin-top:16px;padding:12px;border-radius:10px;background:#171717;white-space:pre-wrap;line-height:1.45}.ok{border-left:5px solid var(--green)}.bad{border-left:5px solid var(--red)}small{color:#bbb;display:block;margin-top:12px;line-height:1.4}
</style>
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
</head>
<body>
<main>
<div class="card">
<h1>🖨️ Prueba TP95W</h1>
<p>Impresora configurada en Windows: <b>TP95W Malefica</b></p>
<button class="btn primary" onclick="testPrinter()">🖨️ Probar impresora</button>
<button class="btn secondary" onclick="connectQZ()">🔌 Conectar QZ Tray</button>
<div id="status" class="status">Listo para probar.</div>
<small>QZ Tray debe estar abierto en esta computadora. En la primera conexión puede aparecer una ventana de autorización de QZ Tray.</small>
</div>
</main>
<script>
const PRINTER_NAME='TP95W Malefica';
const statusEl=document.getElementById('status');
function setStatus(msg,ok){statusEl.textContent=msg;statusEl.className='status '+(ok===true?'ok':ok===false?'bad':'')}
async function connectQZ(){
 try{
  if(!window.qz) throw new Error('No se pudo cargar la librería QZ Tray.');
  if(!qz.websocket.isActive()){
   setStatus('Conectando con QZ Tray...');
   await qz.websocket.connect();
  }
  setStatus('QZ Tray conectado.',true);
  return true;
 }catch(e){
  setStatus('No se pudo conectar con QZ Tray:\n'+(e && e.message ? e.message : e),false);
  return false;
 }
}
async function testPrinter(){
 try{
  if(!(await connectQZ())) return;
  setStatus('Buscando '+PRINTER_NAME+'...');
  const printer=await qz.printers.find(PRINTER_NAME);
  const config=qz.configs.create(printer,{encoding:'CP850'});
  const ESC='\x1B', GS='\x1D';
  const ticket=
   ESC+'@'+
   ESC+'a'+'\x01'+
   ESC+'E'+'\x01'+'MALEFICA BURGER'+ESC+'E'+'\x00'+'\n'+
   'PRUEBA DE IMPRESION\n'+
   'TP95W conectada correctamente\n'+
   '--------------------------------\n'+
   ESC+'a'+'\x00'+
   'Impresion por QZ Tray\n'+
   '\n\n\n'+
   GS+'V'+'\x00';
  const data=[{type:'raw',format:'command',flavor:'plain',data:ticket}];
  setStatus('Enviando ticket a '+printer+'...');
  await qz.print(config,data);
  setStatus('Ticket enviado a '+printer+'.\nSi salió impreso y cortó el papel, la prueba fue correcta.',true);
 }catch(e){
  setStatus('Error al imprimir:\n'+(e && e.message ? e.message : e),false);
 }
}
</script>
</body>
</html>
