name: Resaltar producto seleccionado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resaltar-producto-seleccionado.yml'

permissions:
  contents: write

jobs:
  aplicar-cambio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agregar borde al producto seleccionado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          css_marker = '.product:active{transform:scale(.99)}'
          css_selected = '.product.selected{border:3px solid var(--orange);box-shadow:0 0 0 2px rgba(255,122,0,.28)}'
          if css_selected not in s:
              if css_marker not in s:
                  raise SystemExit('No se encontro el marcador CSS esperado')
              s = s.replace(css_marker, css_marker + '\n' + css_selected, 1)

          js_selected = r'''
function syncProductSelection(){
 const selectedNames=[...document.querySelectorAll('#cart .cart-item span')].map(el=>el.textContent.replace(/^\d+\s*×\s*/, '').trim());
 document.querySelectorAll('.product').forEach(card=>{
  const name=card.querySelector('b')?.textContent.trim();
  card.classList.toggle('selected',selectedNames.includes(name));
 });
}
const cartSelectionObserver=new MutationObserver(syncProductSelection);
cartSelectionObserver.observe(document.getElementById('cart'),{childList:true,subtree:true});
syncProductSelection();
'''.strip()

          if 'function syncProductSelection()' not in s:
              if '</script>' not in s:
                  raise SystemExit('No se encontro </script>')
              s = s.replace('</script>', js_selected + '\n</script>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambio en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "UI: resaltar producto seleccionado"
          git push
